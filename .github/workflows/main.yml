name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

jobs:
  # Cancel prior in-flight CI for this PR when it returns to draft.
  # Fork PRs may lack actions:write; cancel then no-ops (documented limit).
  cancel-on-converted-to-draft:
    if: github.event_name == 'pull_request' && github.event.action == 'converted_to_draft'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel in-progress runs for this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Collect run IDs for this PR that are still active; skip this cancel run.
          run_ids="$(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/runs?event=pull_request&per_page=100" \
              --jq ".workflow_runs[]
                | select(.id != ${CURRENT_RUN_ID})
                | select(.status == \"queued\" or .status == \"in_progress\"
                    or .status == \"waiting\" or .status == \"requested\"
                    or .status == \"pending\")
                | select([.pull_requests[].number] | index(${PR_NUMBER}) != null)
                | .id"
          )"
          if [ -z "${run_ids}" ]; then
            echo "No in-flight runs to cancel for PR #${PR_NUMBER}"
            exit 0
          fi
          echo "${run_ids}" | while read -r run_id; do
            echo "Cancelling run ${run_id}"
            gh run cancel "${run_id}" --repo "${REPO}" || true
          done

  # Path gates for pull_request only. Push to main always runs all three tests.
  path-filter:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'converted_to_draft' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend_unit: ${{ steps.filter.outputs.backend_unit }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/main.yml'
            backend_unit:
              - 'backend/**'
              - 'frontend/lib/api/generated/**'
              - '.github/workflows/main.yml'
            integration:
              - 'backend/**'
              - '.github/workflows/main.yml'

  frontend-unit-tests:
    needs: path-filter
    if: >
      always() && !cancelled() &&
      (
        github.event_name == 'push' ||
        (
          needs.path-filter.result == 'success' &&
          needs.path-filter.outputs.frontend == 'true'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend unit tests (Vitest)
        run: npm run test:run
        working-directory: frontend

  backend-unit-tests:
    needs: path-filter
    if: >
      always() && !cancelled() &&
      (
        github.event_name == 'push' ||
        (
          needs.path-filter.result == 'success' &&
          needs.path-filter.outputs.backend_unit == 'true'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path backend/Cargo.toml -- --check

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Write build revision
        run: ./backend/scripts/write_rev.sh

      - name: Run Unit Tests
        run: cargo test --lib --workspace --manifest-path backend/Cargo.toml

      - name: Verify TypeScript DTO bindings are up to date
        run: |
          cargo test export_typescript_bindings --workspace --manifest-path backend/Cargo.toml
          git diff --exit-code -- frontend/lib/api/generated/

  integration-tests:
    needs: path-filter
    if: >
      always() && !cancelled() &&
      (
        github.event_name == 'push' ||
        (
          needs.path-filter.result == 'success' &&
          needs.path-filter.outputs.integration == 'true'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Write build revision
        run: ./backend/scripts/write_rev.sh

      - name: Run Integration Tests
        run: cd backend && cargo test --test '*'

  # Headless Playwright against local docker-dev builds (no ECR, no Resend, Alloy optional/skipped).
  e2e-tests:
    if: >
      always() && !cancelled() &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action != 'converted_to_draft' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.base.ref == 'main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright Chromium
        run: npm run playwright:install
        working-directory: e2e

      - name: Start docker-dev stack for e2e
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash e2e/scripts/up.sh

      - name: Wait for API health and frontend URL
        run: bash e2e/scripts/wait-ready.sh

      - name: Run Playwright e2e smoke
        env:
          CI: "true"
        run: |
          set -a
          # shellcheck disable=SC1091
          source .e2e.env
          set +a
          export FRONTEND_URL="http://localhost:${FRONTEND_PORT}"
          export API_BASE_URL="http://localhost:${APP_PORT}"
          export E2E_DB_PATH="${PWD}/backend/data/e2e.db"
          export PLAYWRIGHT_ARTIFACTS_DIR="${PWD}/e2e/test-results"
          cd e2e && npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore

      - name: Tear down e2e stack
        if: always()
        run: bash e2e/scripts/down.sh

  # path-filter is skipped on push; test jobs still run via always().
  # Deploy must also use always() + explicit success checks, or GitHub skips
  # this job when a skipped ancestor sits in the needs graph (#264 regression).
  deploy-prod-images:
    if: >
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.frontend-unit-tests.result == 'success' &&
      needs.backend-unit-tests.result == 'success' &&
      needs.integration-tests.result == 'success' &&
      needs.e2e-tests.result == 'success'
    needs: [frontend-unit-tests, backend-unit-tests, integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
      ECR_REGISTRY: 089366939950.dkr.ecr.us-west-2.amazonaws.com
      BACKEND_REPO: life-manager-backend
      FRONTEND_REPO: life-manager-frontend
      GATEWAY_REPO: life-manager-gateway
      ALLOY_REPO: alloy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed image paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            gateway:
              - 'nginx/**'
            alloy:
              - 'observability/**'

      - name: Write build revision
        if: steps.changes.outputs.backend == 'true'
        run: ./backend/scripts/write_rev.sh

      - name: Configure AWS credentials
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.gateway == 'true' || steps.changes.outputs.alloy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.gateway == 'true' || steps.changes.outputs.alloy == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ github.sha }}

      - name: Build and push frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ github.sha }}

      - name: Build and push gateway image
        if: steps.changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/gateway.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.GATEWAY_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.GATEWAY_REPO }}:${{ github.sha }}

      - name: Build and push alloy image
        if: steps.changes.outputs.alloy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./observability
          file: ./observability/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ALLOY_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ALLOY_REPO }}:${{ github.sha }}

  deploy-prod-lightsail:
    if: >
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.deploy-prod-images.result == 'success'
    needs: deploy-prod-images
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
      ECR_REGISTRY: 089366939950.dkr.ecr.us-west-2.amazonaws.com
      DEPLOY_PATH: /home/ec2-user/life-manager
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR login password
        id: ecr-password
        run: echo "password=$(aws ecr get-login-password --region "${AWS_REGION}")" >> "$GITHUB_OUTPUT"

      - name: Deploy prod stack on Lightsail
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          GITHUB_SHA: ${{ env.GITHUB_SHA }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ec2-user
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          port: 22
          envs: ECR_PASSWORD,ECR_REGISTRY,DEPLOY_PATH,GITHUB_SHA
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            git pull origin main
            bash scripts/deploy-prod-lightsail.sh
